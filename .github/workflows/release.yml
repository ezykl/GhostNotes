name: Build and Release GhostNotes

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Portable and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: dotnet test tests/GhostNotes.Tests --configuration Release --verbosity normal

      - name: Publish Single-File Portable Executable
        run: |
          dotnet publish src/GhostNotes/GhostNotes.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
          Copy-Item publish\GhostNotes.exe publish\GhostNotes-Portable.exe

      - name: Build Windows Installer (Inno Setup)
        run: |
          iscc installer/GhostNotes.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostNotes-Binaries
          path: |
            publish/GhostNotes-Portable.exe
            installer/Output/GhostNotes-Setup.exe

      - name: Release Assets to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/GhostNotes-Portable.exe
            installer/Output/GhostNotes-Setup.exe
          generate_release_notes: true